name: aussie_wild_bloom
description: "A magical ecological adventure across Australia."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/art/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/art/app_icon.png
  adaptive_icon_background: "#073B42"
  adaptive_icon_foreground: assets/art/app_icon.png
  remove_alpha_ios: true
